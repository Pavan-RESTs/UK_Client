<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Result</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #222; /* Dark background */
        color: #fff; /* Light text */
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 100vw; /* Full viewport width */
        height: 100vh; /* Full viewport height */
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      img {
        width: 80vw; /* Full screen width */
        height: 80vh; /* Full screen height */
        object-fit: cover; /* Crop the image from horizontal sides */
        margin: 0;
        padding: 0;
        border: none;
      }
      a {
        position: absolute;
        bottom: 10px;
        text-decoration: none;
        color: #007bff; /* Link color */
        font-size: 16px;
        background-color: rgba(255, 255, 255, 0.8); /* Link background */
        padding: 10px;
        border-radius: 4px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="{{ img_path }}" alt="Plot" />
      <a href="/download">Download Image</a>
    </div>
  </body>
</html>
