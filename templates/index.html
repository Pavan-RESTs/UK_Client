<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Pie Chart Generator</title>
    <link rel="icon" href="Icon_.png" type="image/png" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #222; /* Dark background */
        color: #fff; /* Light text */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        background: #333; /* Dark container background */
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 800px;
        width: 100%;
      }
      h1 {
        margin-bottom: 20px;
        color: #fff; /* Light text for headings */
      }
      input[type="file"] {
        margin-bottom: 0px;
      }
      input[type="submit"] {
        display: inline;
        background-color: rgba(0, 123, 255, 0.8);
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      input[type="submit"]:hover {
        background-color: rgba(0, 123, 255, 0.8);
      }
      input[type="submit"]:disabled {
        background-color: #777; /* Disabled button color */
        cursor: not-allowed;
      }
      #colorSelection {
        display: none;
      }
      #colorGrid {
        display: grid;
        grid-template-columns: repeat(10, 1fr); /* Default 10 columns */
        gap: 10px;
      }
      .color-img-container {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .color-img {
        padding-bottom: 10px;
        width: 100%;
        height: auto;
        max-width: 20px; /* Adjust as needed */
        max-height: 20px; /* Adjust as needed */
      }
      #customText {
        width: 50%; /* Full width */
        padding: 10px; /* Padding around the text */
        border: 1px solid #ccc; /* Border around the text field */
        border-radius: 4px; /* Rounded corners */
        font-size: 16px; /* Font size */
        margin-bottom: 10px; /* Margin below the text field */
      }
      #fileFormat {
        width: 24%; /* Full width */
        padding: 10px; /* Padding around the dropdown */
        border: 1px solid #ccc; /* Border around the dropdown */
        border-radius: 4px; /* Rounded corners */
        font-size: 16px; /* Font size */
        margin-bottom: 10px; /* Margin below the dropdown */
      }
      #colorCount {
        margin-top: 10px;
        font-weight: bold;
      }
      .spinner {
        margin: 0 auto;
        width: 40px;
        height: 40px;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-top: 5px solid rgba(0, 123, 255, 0.8);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload a CSV File and Select Colors</h1>
      <form
        id="uploadForm"
        action="/upload"
        method="post"
        enctype="multipart/form-data"
      >
        <input type="file" name="file" accept=".csv" id="csvFile" />
        <br />
        <div id="colorCount"></div>
        <div id="colorSelection">
          <div id="colorGrid">
            <!-- Color images and checkboxes will be dynamically added here -->
          </div>
        </div>
        <br />
        <input
          type="text"
          id="customText"
          placeholder="Enter plot name (Upto 12 Characters)"
        />
        <br />
        <select id="fileFormat">
          <option value="png">PNG (Transparent)</option>
          <option value="jpg">JPG</option>
          <option value="jpeg">JPEG</option>
        </select>
        <input type="submit" value="Submit" id="submitBtn" disabled />
      </form>
      <div id="loading" style="display: none; text-align: center">
        <div class="spinner"></div>
        <p>Loading, please wait...</p>
      </div>
    </div>
    <script>
      const csvFile = document.getElementById("csvFile");
      const colorSelection = document.getElementById("colorSelection");
      const colorGrid = document.getElementById("colorGrid");
      const submitBtn = document.getElementById("submitBtn");
      const uploadForm = document.getElementById("uploadForm");
      const colorCountDiv = document.getElementById("colorCount");

      let requiredColors = 0;
      let gridColumns = 10; // Default number of columns

      csvFile.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch("/process_csv", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();
        requiredColors = data.column_count;

        colorGrid.innerHTML = "";
        colorSelection.style.display = "block";
        updateColorCount(0);

        const colors = [
          "aliceblue",
          "antiquewhite",
          "aqua",
          "aquamarine",
          "azure",
          "beige",
          "bisque",
          "black",
          "blanchedalmond",
          "blue",
          "blueviolet",
          "brown",
          "burlywood",
          "cadetblue",
          "chartreuse",
          "chocolate",
          "coral",
          "cornflowerblue",
          "cornsilk",
          "crimson",
          "cyan",
          "darkblue",
          "darkcyan",
          "darkgoldenrod",
          "darkgray",
          "darkgreen",
          "darkgrey",
          "darkkhaki",
          "darkmagenta",
          "darkolivegreen",
          "darkorange",
          "darkorchid",
          "darkred",
          "darksalmon",
          "darkseagreen",
          "darkslateblue",
          "darkslategray",
          "darkslategrey",
          "darkturquoise",
          "darkviolet",
          "deeppink",
          "deepskyblue",
          "dimgray",
          "dimgrey",
          "dodgerblue",
          "firebrick",
          "floralwhite",
          "forestgreen",
          "fuchsia",
          "gainsboro",
          "ghostwhite",
          "gold",
          "goldenrod",
          "gray",
          "green",
          "greenyellow",
          "grey",
          "honeydew",
          "hotpink",
          "indianred",
          "indigo",
          "ivory",
          "khaki",
          "lavender",
          "lavenderblush",
          "lawngreen",
          "lemonchiffon",
          "lightblue",
          "lightcoral",
          "lightcyan",
          "lightgoldenrodyellow",
          "lightgray",
          "lightgreen",
          "lightgrey",
          "lightpink",
          "lightsalmon",
          "lightseagreen",
          "lightskyblue",
          "lightslategray",
          "lightslategrey",
          "lightsteelblue",
          "lightyellow",
          "lime",
          "limegreen",
          "linen",
          "magenta",
          "maroon",
          "mediumaquamarine",
          "mediumblue",
          "mediumorchid",
          "mediumpurple",
          "mediumseagreen",
          "mediumslateblue",
          "mediumspringgreen",
          "mediumturquoise",
          "mediumvioletred",
          "midnightblue",
          "mintcream",
          "mistyrose",
          "moccasin",
          "navajowhite",
          "navy",
          "oldlace",
          "olive",
          "olivedrab",
          "orange",
          "orangered",
          "orchid",
          "palegoldenrod",
          "palegreen",
          "paleturquoise",
          "palevioletred",
          "papayawhip",
          "peachpuff",
          "peru",
          "pink",
          "plum",
          "powderblue",
          "purple",
          "rebeccapurple",
          "red",
          "rosybrown",
          "royalblue",
          "saddlebrown",
          "salmon",
          "sandybrown",
          "seagreen",
          "seashell",
          "sienna",
          "silver",
          "skyblue",
          "slateblue",
          "slategray",
          "slategrey",
          "snow",
          "springgreen",
          "steelblue",
          "tan",
          "teal",
          "thistle",
          "tomato",
          "turquoise",
          "violet",
          "wheat",
          "white",
          "whitesmoke",
          "yellow",
          "yellowgreen",
        ];

        const rowsPerTable = Math.ceil(colors.length / gridColumns);

        for (let i = 0; i < colors.length; i += rowsPerTable) {
          const row = document.createElement("div");
          row.className = "color-grid-row";

          for (let j = i; j < i + rowsPerTable && j < colors.length; j++) {
            const colorImgContainer = document.createElement("div");
            colorImgContainer.className = "color-img-container";

            const img = document.createElement("img");
            img.src = `/colors/${colors[j]}.png`;
            img.alt = colors[j];
            img.className = "color-img";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.name = "colors";
            checkbox.value = colors[j];
            checkbox.dataset.index = j;

            colorImgContainer.appendChild(img);
            colorImgContainer.appendChild(checkbox);
            row.appendChild(colorImgContainer);
          }

          colorGrid.appendChild(row);
        }

        const checkboxes = document.querySelectorAll('input[name="colors"]');
        checkboxes.forEach((checkbox) => {
          checkbox.addEventListener("change", () => {
            const checkedCount = document.querySelectorAll(
              'input[name="colors"]:checked'
            ).length;
            updateColorCount(checkedCount);
            submitBtn.disabled = checkedCount !== requiredColors;
          });
        });
      });

      function updateColorCount(selectedCount) {
        colorCountDiv.textContent = `Select ${requiredColors} colors (${selectedCount}/${requiredColors} selected)`;
      }
      uploadForm.addEventListener("submit", (event) => {
        event.preventDefault();

        // Show loading spinner
        document.getElementById("loading").style.display = "block";

        const formData = new FormData(uploadForm);
        const selectedColors = Array.from(
          document.querySelectorAll('input[name="colors"]:checked')
        ).map((checkbox) => checkbox.value);
        const customText = document.getElementById("customText").value;
        const fileFormat = document.getElementById("fileFormat").value;

        formData.append("selectedColors", JSON.stringify(selectedColors));
        formData.append("customText", customText);
        formData.append("fileFormat", fileFormat);

        fetch("/upload", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.text())
          .then((html) => {
            document.body.innerHTML = html;
          });
      });
    </script>
  </body>
</html>
